<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema Go Print - Gestión</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; display: flex; height: 100vh; background: #f1f5f9; }
    
    #login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #5b3693; display: flex; justify-content: center; align-items: center; z-index: 2000; }
    .login-card { background: white; padding: 40px; border-radius: 16px; width: 380px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); text-align: center; }
    .login-input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 1rem; }
    .login-btn { width: 100%; padding: 12px; background: #5b3693; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .login-error { color: #ef4444; font-size: 0.85rem; margin-top: 10px; display: none; }

    #app-container { display: none; width: 100%; height: 100vh; }
    .sidebar { width: 260px; background: #5b3693; color: white; padding: 20px; display: flex; flex-direction: column; gap: 20px; border-right: 1px solid #1e293b; }
    .brand-container { display: flex; flex-direction: column; align-items: center; text-align: center; border-bottom: 1px solid #334155; padding-bottom: 10px; }
    .brand-logo { width: 110px; height: auto; margin-bottom: 8px; }

    .menu { display: flex; flex-direction: column; gap: 10px; flex: 1; }
    .menu-item { padding: 12px 15px; border-radius: 8px; color: #94a3b8; text-decoration: none; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .menu-item:hover, .menu-item.active { background: #341a5c; color: white; }
    
    .user-info { font-size: 0.85rem; color: #cbd5e1; border-top: 1px solid #334155; padding-top: 15px; display: flex; flex-direction: column; gap: 8px; }
    .btn-logout { background: #ef4444; color: white; border: none; padding: 6px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.8rem; }

    .content { flex: 1; padding: 30px; overflow-y: auto; background: #f1f5f9; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
    .header h1 { margin: 0; font-size: 1.8rem; color: #5b3693; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 20px; }
    .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); border-left: 6px solid #7c3aed; }
    
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .card-title { font-size: 1.1rem; font-weight: bold; color: #5b3693; margin: 0; }
    
    .badge { padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; background: #fef3c7; color: #92400e; }
    .badge-success { background: #d1fae5; color: #065f46; }

    .data-group { margin-bottom: 8px; font-size: 0.9rem; color: #334155; }
    .data-group span { font-weight: bold; color: #60008d; }

    .file-actions { display: flex; flex-direction: column; gap: 8px; margin: 15px 0; background: #f8fafc; padding: 12px; border-radius: 8px; }
    .item-row { display: flex; justify-content: space-between; align-items: center; background: white; padding: 6px 10px; border-radius: 6px; border: 1px solid #e2e8f0; width: 100%; gap: 6px; }

    .btn { padding: 8px 12px; border-radius: 6px; border: none; font-weight: bold; font-size: 0.85rem; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 5px; width: 100%; margin-bottom: 8px; }
    .btn-download { color: #334155; text-decoration: none; font-size: 0.85rem; font-weight: 500; word-break: break-all; flex: 1; }
    .btn-ot { background: #5b3693; color: white; }
    .btn-status { background: #0ada56; color: white; }
    .btn-status:disabled { background: #cbd5e1; cursor: not-allowed; }

    .input-custom { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #cbd5e1; font-size: 0.85rem; box-sizing: border-box; margin-top: 4px; }
    .input-group { margin-bottom: 10px; }
    .input-group label { font-size: 0.8rem; font-weight: bold; color: #5b3693; display: block; }
  </style>
</head>
<body>

  <div id="login-screen">
    <div class="login-card">
      <h2>Go Print - Acceso</h2>
      <form onsubmit="realizarLogin(event)">
        <input type="text" id="login-user" class="login-input" placeholder="Usuario" required>
        <input type="password" id="login-pass" class="login-input" placeholder="Contraseña" required>
        <button type="submit" class="login-btn">Ingresar al Sistema</button>
        <div id="login-error" class="login-error">Credenciales incorrectas</div>
      </form>
    </div>
  </div>

  <div id="app-container">
    <div class="sidebar">
      <div class="brand-container"><img src="/Imagenes/logo.png" alt="Logo" class="brand-logo"></div>
      <h2>PANEL DE CONTROL</h2>
      <div class="menu">
        <div class="menu-item active" id="btn-diseno" onclick="cargarSeccion('diseno')">🎨 DISEÑO</div>
        <div class="menu-item" id="btn-impresion" onclick="cargarSeccion('impresion')">🖨️ IMPRESIÓN</div>
        <div class="menu-item" id="btn-entrega" onclick="cargarSeccion('entrega')">📦 ENTREGA</div>
        <div class="menu-item" id="btn-historial" onclick="cargarSeccion('historial')">📚 HISTORIAL</div>
      </div>
      <div class="user-info">
        <span>👤 <strong id="lbl-username">Admin</strong> (<span id="lbl-role">admin</span>)</span>
        <button onclick="cerrarSesion()" class="btn-logout">Cerrar Sesión</button>
      </div>
    </div>

    <div class="content">
      <div class="header"><h1 id="seccion-titulo">Área de Diseño 🎨</h1></div>
      <div class="grid" id="orders-container"></div>
    </div>
  </div>

  <script>
    let seccionActual = 'diseno';
    let usuarioActual = JSON.parse(localStorage.getItem('goprint_user') || 'null');

    window.onload = function() { if (usuarioActual) mostrarApp(); };

    async function realizarLogin(e) {
      e.preventDefault();
      const username = document.getElementById('login-user').value.trim();
      const password = document.getElementById('login-pass').value.trim();
      try {
        const res = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username, password }) });
        const data = await res.json();
        if (res.ok && data.success) {
          usuarioActual = data;
          localStorage.setItem('goprint_user', JSON.stringify(data));
          mostrarApp();
        } else {
          document.getElementById('login-error').style.display = 'block';
        }
      } catch (err) { console.error(err); }
    }

    function mostrarApp() {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('app-container').style.display = 'flex';
      document.getElementById('lbl-username').innerText = usuarioActual.username;
      document.getElementById('lbl-role').innerText = usuarioActual.role;
      
      const role = (usuarioActual.role || '').toLowerCase();
      if (role === 'impresion') cargarSeccion('impresion');
      else if (role === 'entrega') cargarSeccion('entrega');
      else cargarSeccion('diseno');
    }

    function cerrarSesion() {
      localStorage.removeItem('goprint_user');
      usuarioActual = null;
      document.getElementById('app-container').style.display = 'none';
      document.getElementById('login-screen').style.display = 'flex';
    }

    function cargarSeccion(seccion) {
      seccionActual = seccion;
      document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));
      const activeEl = document.getElementById(`btn-${seccion}`);
      if (activeEl) activeEl.classList.add('active');

      const titulos = { diseno: 'Área de Diseño 🎨', impresion: 'Área de Impresión 🖨️', entrega: 'Área de Entrega 📦', historial: 'Historial 📚' };
      document.getElementById('seccion-titulo').innerText = titulos[seccion];
      cargarOrdenes();
    }

    async function cargarOrdenes() {
      const container = document.getElementById('orders-container');
      try {
        const res = await fetch(`/api/ordenes/${seccionActual}`);
        const ordenes = await res.json();
        container.innerHTML = '';

        if (!Array.isArray(ordenes) || ordenes.length === 0) {
          container.innerHTML = '<p style="color: #64748b; font-weight: bold;">No hay pedidos en esta sección.</p>';
          return;
        }

        ordenes.forEach(ot => {
          let listadoItemsHTML = '';
          let todosImpresos = true;
          let todosEntregados = true;
          let totalM2 = 0;

          if (ot.items && ot.items.length > 0) {
            listadoItemsHTML = ot.items.map(item => {
              const ancho = parseFloat(item.width_cm || 0);
              const alto = parseFloat(item.height_cm || 0);
              const esUnitario = (item.material || '').toLowerCase().includes('fly banner');

              if (seccionActual === 'impresion' && !item.is_printed) todosImpresos = false;
              if (seccionActual === 'entrega' && !item.is_delivered_item) todosEntregados = false;

              totalM2 += esUnitario ? (item.copies || 1) : ((ancho / 100) * (alto / 100) * (item.copies || 1));

              if (seccionActual === 'impresion') {
                return `
                  <div class="item-row">
                    <a href="${item.file_url || '#'}" target="_blank" class="btn-download">📥 ${item.file_name}</a>
                    <label style="font-size: 0.8rem; font-weight: bold; cursor: pointer;">
                      <input type="checkbox" ${item.is_printed ? 'checked' : ''} onchange="toggleItemStatus(${item.id}, 'printed', this.checked)"> ${item.is_printed ? 'IMPRESO ✔️' : 'Pendiente'}
                    </label>
                  </div>`;
              } else if (seccionActual === 'entrega') {
                return `
                  <div class="item-row">
                    <a href="${item.file_url || '#'}" target="_blank" class="btn-download">📥 ${item.file_name}</a>
                    <label style="font-size: 0.8rem; font-weight: bold; cursor: pointer;">
                      <input type="checkbox" ${item.is_delivered_item ? 'checked' : ''} onchange="toggleItemStatus(${item.id}, 'delivered', this.checked)"> ${item.is_delivered_item ? 'LISTO ✔️' : 'Pendiente'}
                    </label>
                  </div>`;
              } else {
                return `<div class="item-row"><span class="btn-download">📥 ${item.file_name}</span></div>`;
              }
            }).join('');
          }

          let botonSiguiente = '';
          let seccionEntregaExtra = '';

          if (seccionActual === 'diseno') {
            botonSiguiente = `<button onclick="cambiarEstado(${ot.ot_numero}, 'READY_TO_PRINT')" class="btn btn-status">Pasar a Impresión ➔</button>`;
          } else if (seccionActual === 'impresion') {
            botonSiguiente = `<button onclick="cambiarEstado(${ot.ot_numero}, 'READY_TO_DELIVER')" class="btn btn-status" ${!todosImpresos ? 'disabled style="background:#cbd5e1;cursor:not-allowed;"' : ''}>Pasar a Entrega ➔</button>`;
          } else if (seccionActual === 'entrega') {
            seccionEntregaExtra = `
              <div class="input-group">
                <label>Entrega (Fecha Prometida):</label>
                <input type="text" class="input-custom" value="${ot.fecha_prometida || ''}" onchange="guardarInfoEntrega(${ot.ot_numero}, 'fecha_prometida', this.value)" placeholder="Ej. Viernes 15hs">
              </div>`;
            
            botonSiguiente = `<button onclick="cambiarEstado(${ot.ot_numero}, 'DELIVERED')" class="btn btn-status" ${!todosEntregados ? 'disabled style="background:#cbd5e1;cursor:not-allowed;"' : ''}>Finalizar Entrega (Enviar a Historial) ✔️</button>`;
            
            seccionEntregaExtra += `
              <div class="input-group" style="margin-top: 8px;">
                <label>Entregado por:</label>
                <input type="text" class="input-custom" value="${ot.entregado_por || ''}" onchange="guardarInfoEntrega(${ot.ot_numero}, 'entregado_por', this.value)" placeholder="Nombre del empleado">
              </div>
              <div class="input-group" style="margin-top: 8px; margin-bottom: 12px;">
                <label>Fecha de Entrega:</label>
                <input type="text" class="input-custom" value="${ot.fecha_entrega || ''}" onchange="guardarInfoEntrega(${ot.ot_numero}, 'fecha_entrega', this.value)" placeholder="Ej. 26/09/2026">
              </div>`;
          }

          container.innerHTML += `
            <div class="card">
              <div class="card-header">
                <h3 class="card-title">OT #${ot.ot_numero}</h3>
                <span class="badge">${ot.status}</span>
              </div>
              <div class="data-group"><span>Cliente:</span> <strong>${ot.client_name}</strong></div>
              <div class="data-group"><span>Resumen:</span> ${totalM2.toFixed(2)} m² total</div>
              <div class="data-group"><span>Total:</span> $${ot.total_price} ARS</div>
              
              ${seccionEntregaExtra}

              <div class="file-actions">
                <span style="font-size: 0.85rem; font-weight: bold;">Archivos / Ítems:</span>
                ${listadoItemsHTML}
              </div>

              <button onclick="window.open('/ot/${ot.ot_numero}', '_blank')" class="btn btn-ot">📄 Ver / Descargar Orden de Trabajo</button>
              ${botonSiguiente}
            </div>`;
        });
      } catch (err) { console.error(err); }
    }

    async function toggleItemStatus(itemId, tipo, isChecked) {
      const endpoint = tipo === 'printed' ? `/api/ordenes/item/printed/${itemId}` : `/api/ordenes/item/delivered/${itemId}`;
      const payload = tipo === 'printed' ? { is_printed: isChecked } : { is_delivered_item: isChecked };
      
      await fetch(endpoint, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
      cargarOrdenes();
    }

    async function guardarInfoEntrega(otId, campo, valor) {
      const body = {};
      body[campo] = valor;
      await fetch(`/api/ordenes/entrega-info/${otId}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    }

    async function cambiarEstado(id, nuevoEstado) {
      if(!confirm(`¿Deseas avanzar el estado de la OT #${id}?`)) return;
      await fetch(`/api/ordenes/estado/${id}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ status: nuevoEstado }) });
      cargarOrdenes();
    }
  </script>
</body>
</html>
