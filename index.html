<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema Go Print - Acceso</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; display: flex; height: 100vh; background: #f1f5f9; }
    
    /* Pantalla de Login */
    #login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #5b3693; display: flex; justify-content: center; align-items: center; z-index: 2000; }
    .login-card { background: white; padding: 40px; border-radius: 16px; width: 380px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); text-align: center; }
    .login-card h2 { color: #5b3693; margin-top: 0; margin-bottom: 20px; font-size: 1.5rem; }
    .login-input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 1rem; box-sizing: border-box; }
    .login-btn { width: 100%; padding: 12px; background: #5b3693; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; transition: 0.2s; }
    .login-btn:hover { background: #341a5c; }
    .login-error { color: #ef4444; font-size: 0.85rem; margin-top: 10px; display: none; }

    /* Sistema Principal */
    #app-container { display: none; width: 100%; height: 100vh; }
    .sidebar { width: 260px; background: #5b3693; color: white; padding: 20px; display: flex; flex-direction: column; gap: 20px; border-right: 1px solid #1e293b; }
    
    .brand-container { display: flex; flex-direction: column; align-items: center; text-align: center; padding-bottom: 10px; border-bottom: 1px solid #334155; }
    .brand-logo { width: 110px; height: auto; margin-bottom: 8px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3)); }

    .sidebar h2 { margin: 0; font-size: 1.1rem; color: #a78bfa; padding-top: 5px; }
    .menu { display: flex; flex-direction: column; gap: 10px; flex: 1; }
    .menu-item { padding: 12px 15px; border-radius: 8px; color: #94a3b8; text-decoration: none; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .menu-item:hover, .menu-item.active { background: #341a5c; color: white; }
    
    .user-info { font-size: 0.85rem; color: #cbd5e1; border-top: 1px solid #334155; padding-top: 15px; display: flex; flex-direction: column; gap: 8px; }
    .btn-logout { background: #ef4444; color: white; border: none; padding: 6px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.8rem; }
    .btn-logout:hover { background: #dc2626; }

    .content { flex: 1; padding: 30px; overflow-y: auto; background: #f1f5f9; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
    .header h1 { margin: 0; font-size: 1.8rem; color: #5b3693; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 20px; }
    
    .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); border-left: 6px solid #7c3aed; transition: 0.3s; }
    .card.warning { border-left: 6px solid #f97316; background: #fff8f6; }
    .card.delivered { border-left: 6px solid #10b981; background: #f8fafc; }

    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .card-title { font-size: 1.1rem; font-weight: bold; color: #5b3693; margin: 0; display: flex; align-items: center; gap: 8px; }
    
    .badge { padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; background: #fef3c7; color: #92400e; }
    .badge-warning { background: #ffedd5; color: #c2410c; border: 1px solid #f97316; }
    .badge-success { background: #d1fae5; color: #065f46; }

    .data-group { margin-bottom: 8px; font-size: 0.9rem; color: #334155; }
    .data-group span { font-weight: bold; color: #60008d; }
    .email-tag { color: #64748b; font-size: 0.85rem; font-weight: normal; }

    .file-actions { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; margin: 15px 0; background: #f8fafc; padding: 12px; border-radius: 8px; }
    .attachments-container { display: flex; flex-direction: column; gap: 8px; width: 100%; margin-top: 4px; }
    
    .item-row { display: flex; justify-content: space-between; align-items: center; background: white; padding: 6px 10px; border-radius: 6px; border: 1px solid #e2e8f0; width: 100%; gap: 6px; }
    .item-row.warning-item { border-color: #f97316; background: #fff1f2; }

    .btn { padding: 8px 12px; border-radius: 6px; border: none; font-weight: bold; font-size: 0.85rem; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 5px; }
    .btn-download { color: #334155; text-decoration: none; font-size: 0.85rem; font-weight: 500; word-break: break-all; flex: 1; }
    .btn-download:hover { color: #5b3693; }
    .btn-ot { background: #5b3693; color: white; margin-bottom: 8px; width: 100%; }
    .btn-ot:hover { background: #341a5c; }
    .btn-gmail { background: #5b3693; color: white; margin-bottom: 10px; width: 100%; }
    .btn-gmail:hover { background: #341a5c; }
    .btn-status { background: #0ada56; color: white; width: 100%; margin-bottom: 8px; }
    .btn-status:hover { background: #0bd15b; }
    .btn-status:disabled { background: #cbd5e1; cursor: not-allowed; }
    
    .btn-edit { border: none; background: none; cursor: pointer; font-size: 0.9rem; }
    .btn-edit-size { background: #f97316; color: white; border: none; padding: 3px 6px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; cursor: pointer; white-space: nowrap; }
    .btn-edit-size:hover { background: #ea580c; }
    .btn-delete-item { background: #ef4444; color: white; border: none; padding: 3px 6px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; cursor: pointer; white-space: nowrap; }
    .btn-delete-item:hover { background: #dc2626; }
    .btn-add-item { background: #10b981; color: white; border: none; padding: 6px 10px; border-radius: 6px; font-size: 0.8rem; font-weight: bold; cursor: pointer; width: 100%; margin-top: 6px; }
    .btn-add-item:hover { background: #059669; }
    
    .btn-delete-order { background: #fee2e2; color: #dc2626; border: 1px solid #fecaca; width: 100%; margin-top: 6px; }
    .btn-delete-order:hover { background: #dc2626; color: white; }

    /* Estilos para inputs de Entrega */
    .input-custom { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #cbd5e1; font-size: 0.85rem; box-sizing: border-box; margin-top: 4px; background: #fff; }
    .input-group { margin-bottom: 12px; }
    .input-group label { font-size: 0.8rem; font-weight: bold; color: #5b3693; display: block; }

    /* Estilo Botón Flotante de Orden Manual */
    .btn-floating-add { position: fixed; bottom: 30px; right: 30px; background-color: #10b981; color: white; border: none; border-radius: 50%; width: 60px; height: 60px; font-size: 30px; box-shadow: 0px 4px 10px rgba(0,0,0,0.3); cursor: pointer; z-index: 1000; display: flex; justify-content: center; align-items: center; transition: 0.2s; }
    .btn-floating-add:hover { background-color: #059669; transform: scale(1.05); }
  </style>
</head>
<body>

  <!-- PANTALLA DE LOGIN -->
  <div id="login-screen">
    <div class="login-card">
      <h2>Go Print - Acceso</h2>
      <form onsubmit="realizarLogin(event)">
        <input type="text" id="login-user" class="login-input" placeholder="Usuario" required autocomplete="username">
        <input type="password" id="login-pass" class="login-input" placeholder="Contraseña" required autocomplete="current-password">
        <button type="submit" class="login-btn">Ingresar al Sistema</button>
        <div id="login-error" class="login-error">Usuario o contraseña incorrectos</div>
      </form>
    </div>
  </div>

  <!-- APLICACIÓN PRINCIPAL -->
  <div id="app-container">
    <div class="sidebar">
      <div class="brand-container">
        <img src="/Imagenes/logo.png" alt="Go Print Logo" class="brand-logo">
      </div>

      <h2>PANEL DE CONTROL</h2>
      <div class="menu">
        <div class="menu-item active" id="btn-diseno" onclick="cargarSeccion('diseno')">🎨 DISEÑO</div>
        <div class="menu-item" id="btn-impresion" onclick="cargarSeccion('impresion')">🖨️ IMPRESIÓN</div>
        <div class="menu-item" id="btn-entrega" onclick="cargarSeccion('entrega')">📦 ENTREGA</div>
        <div class="menu-item" id="btn-historial" onclick="cargarSeccion('historial')">📚 HISTORIAL</div>
      </div>

      <div class="user-info">
        <span>👤 <strong id="lbl-username">Admin</strong> (<span id="lbl-role">admin</span>)</span>
        <button onclick="cerrarSesion()" class="btn-logout">Cerrar Sesión</button>
      </div>
    </div>

  <div class="content">
      <div class="header">
        <h1 id="seccion-titulo">Área de Diseño 🎨</h1>
        <!-- 🔍 Barra de Búsqueda -->
        <input type="text" id="input-buscar" placeholder="🔍 Buscar por cliente o Nº de OT..." oninput="filtrarOrdenes()" style="padding: 10px 15px; width: 300px; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 0.9rem; outline: none; background: white;">
      </div>
      <div class="grid" id="orders-container"></div>
    </div>
  </div>

  <!-- Botón Flotante para Crear Orden Manual -->
  <button onclick="abrirModalOrdenManual()" id="btn-floating-manual" class="btn-floating-add" title="Crear Orden Manual" style="display: none;">+</button>

  <!-- Modal para Crear Orden Manual -->
  <div id="modal-orden-manual" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 3000; justify-content: center; align-items: center;">
    <div style="background: white; padding: 25px; border-radius: 12px; width: 400px; box-shadow: 0 4px 15px rgba(0,0,0,0.2);">
      <h3 style="margin-top: 0; color: #5b3693; margin-bottom: 15px;">➕ Crear Nueva Orden Manual</h3>
      
      <form onsubmit="guardarOrdenManual(event)">
        <div style="margin-bottom: 12px;">
          <label style="font-size: 0.85rem; font-weight: bold; color: #334155; display: block; margin-bottom: 4px;">Nombre del Cliente:</label>
          <input type="text" id="manual-client-name" required style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #cbd5e1; box-sizing: border-box;" placeholder="Ej. Juan Pérez">
        </div>

        <div style="margin-bottom: 12px;">
          <label style="font-size: 0.85rem; font-weight: bold; color: #334155; display: block; margin-bottom: 4px;">Teléfono / Email (Opcional):</label>
          <input type="text" id="manual-client-email" style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #cbd5e1; box-sizing: border-box;" placeholder="Ej. juan@mail.com">
        </div>

        <div style="margin-bottom: 20px;">
          <label style="font-size: 0.85rem; font-weight: bold; color: #334155; display: block; margin-bottom: 4px;">Notas / Observaciones:</label>
          <textarea id="manual-notes" style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #cbd5e1; box-sizing: border-box; height: 80px;" placeholder="Detalles del pedido..."></textarea>
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 10px;">
          <button type="button" onclick="cerrarModalOrdenManual()" style="padding: 8px 14px; background: #cbd5e1; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">Cancelar</button>
          <button type="submit" style="padding: 8px 14px; background: #10b981; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">Crear Orden</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal para Agregar Ítem Manualmente -->
  <div id="modal-agregar-item" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 3000; justify-content: center; align-items: center;">
    <div style="background: white; padding: 25px; border-radius: 12px; width: 400px; box-shadow: 0 4px 15px rgba(0,0,0,0.2);">
      <h3 style="margin-top: 0; color: #5b3693; margin-bottom: 15px;">➕ Agregar Nuevo Ítem</h3>
      
      <div style="margin-bottom: 12px;">
        <label style="font-size: 0.85rem; font-weight: bold; color: #334155; display: block; margin-bottom: 4px;">Material:</label>
        <select id="modal-material" style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #cbd5e1;"></select>
      </div>

      <div style="margin-bottom: 12px;">
        <label style="font-size: 0.85rem; font-weight: bold; color: #334155; display: block; margin-bottom: 4px;">Tipo de Impresión:</label>
        <select id="modal-print-type" style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #cbd5e1;"></select>
      </div>

      <div style="margin-bottom: 12px;">
        <label style="font-size: 0.85rem; font-weight: bold; color: #334155; display: block; margin-bottom: 4px;">Nombre del Archivo / Trabajo:</label>
        <input type="text" id="modal-filename" value="Diseno_Extra.cdr" style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #cbd5e1; box-sizing: border-box;">
      </div>

      <div style="display: flex; gap: 10px; margin-bottom: 12px;">
        <div style="flex: 1;">
          <label style="font-size: 0.85rem; font-weight: bold; color: #334155; display: block; margin-bottom: 4px;">Ancho (cm):</label>
          <input type="number" id="modal-width" value="100" style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #cbd5e1; box-sizing: border-box;">
        </div>
        <div style="flex: 1;">
          <label style="font-size: 0.85rem; font-weight: bold; color: #334155; display: block; margin-bottom: 4px;">Alto (cm):</label>
          <input type="number" id="modal-height" value="50" style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #cbd5e1; box-sizing: border-box;">
        </div>
      </div>

      <div style="margin-bottom: 20px;">
        <label style="font-size: 0.85rem; font-weight: bold; color: #334155; display: block; margin-bottom: 4px;">Copias / Cantidad:</label>
        <input type="number" id="modal-copies" value="1" style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #cbd5e1; box-sizing: border-box;">
      </div>

      <div style="display: flex; justify-content: flex-end; gap: 10px;">
        <button onclick="cerrarModalItem()" style="padding: 8px 14px; background: #cbd5e1; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">Cancelar</button>
        <button onclick="guardarItemManual()" style="padding: 8px 14px; background: #10b981; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">Guardar Ítem</button>
      </div>
    </div>
  </div>
  
  <script>
    let seccionActual = 'diseno';
    let currentOtIdParaAgregar = null;
    let usuarioActual = JSON.parse(localStorage.getItem('goprint_user') || 'null');
    let todasLasOrdenesActuales = [];

    window.onload = function() {
      if (usuarioActual) mostrarApp();
    };

    // 🔄 Auto-refresh inteligente (Se pausa automáticamente si alguien está escribiendo)
    setInterval(() => {
      if (usuarioActual && typeof cargarOrdenes === 'function') {
        
        // Si el usuario tiene un input o textarea seleccionado escribiendo, NO recargamos para no interrumpir
        const activeTag = document.activeElement ? document.activeElement.tagName : '';
        if (activeTag === 'INPUT' || activeTag === 'TEXTAREA') {
          return; 
        }

        const inputBuscar = document.getElementById('input-buscar');
        if (!inputBuscar || inputBuscar.value.trim() === '') {
          cargarOrdenes();
        }
      }
    }, 5000);

    async function realizarLogin(e) {
      e.preventDefault();
      const username = document.getElementById('login-user').value.trim();
      const password = document.getElementById('login-pass').value.trim();
      const errorDiv = document.getElementById('login-error');

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (res.ok && data.success) {
          usuarioActual = data;
          localStorage.setItem('goprint_user', JSON.stringify(data));
          errorDiv.style.display = 'none';
          mostrarApp();
        } else {
          errorDiv.innerText = data.error || 'Credenciales incorrectas';
          errorDiv.style.display = 'block';
        }
      } catch (err) {
        console.error(err);
        errorDiv.innerText = 'Error de conexión con el servidor';
        errorDiv.style.display = 'block';
      }
    }

    function mostrarApp() {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('app-container').style.display = 'flex';
      document.getElementById('lbl-username').innerText = usuarioActual.username;
      document.getElementById('lbl-role').innerText = usuarioActual.role;

      const role = (usuarioActual.role || '').toLowerCase();
      const btnDiseno = document.getElementById('btn-diseno');
      const btnImpresion = document.getElementById('btn-impresion');
      const btnEntrega = document.getElementById('btn-entrega');
      const btnHistorial = document.getElementById('btn-historial');
      const btnFloatingManual = document.getElementById('btn-floating-manual');

      if (role === 'admin' || role === 'diseno') {
        btnDiseno.style.display = 'block';
        btnImpresion.style.display = 'block';
        btnEntrega.style.display = 'block';
        btnHistorial.style.display = 'block';
        if(btnFloatingManual) btnFloatingManual.style.display = 'flex';
        cargarSeccion('diseno');
      } else if (role === 'impresion') {
        btnDiseno.style.display = 'none';
        btnImpresion.style.display = 'block';
        btnEntrega.style.display = 'block';
        btnHistorial.style.display = 'block';
        if(btnFloatingManual) btnFloatingManual.style.display = 'none';
        cargarSeccion('impresion');
      } else if (role === 'entrega') {
        btnDiseno.style.display = 'none';
        btnImpresion.style.display = 'none';
        btnEntrega.style.display = 'block';
        btnHistorial.style.display = 'block';
        if(btnFloatingManual) btnFloatingManual.style.display = 'none';
        cargarSeccion('entrega');
      } else {
        cargarSeccion('diseno');
      }
    }

    function cerrarSesion() {
      localStorage.removeItem('goprint_user');
      usuarioActual = null;
      document.getElementById('app-container').style.display = 'none';
      document.getElementById('login-screen').style.display = 'flex';
    }

    function cargarSeccion(seccion) {
      const role = (usuarioActual?.role || '').toLowerCase();
      if ((role === 'impresion' && seccion === 'diseno') || 
          (role === 'entrega' && (seccion === 'diseno' || seccion === 'impresion'))) {
        return;
      }

      seccionActual = seccion;
      document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));
      const activeEl = document.getElementById(`btn-${seccion}`);
      if (activeEl) activeEl.classList.add('active');

      const titulos = {
        diseno: 'Área de Diseño 🎨',
        impresion: 'Área de Impresión 🖨️',
        entrega: 'Área de Entrega 📦',
        historial: 'Historial de Órdenes Entregadas 📚'
      };
      document.getElementById('seccion-titulo').innerText = titulos[seccion] || '';

      const inputBuscar = document.getElementById('input-buscar');
      if (inputBuscar) inputBuscar.value = '';

      cargarOrdenes();
    }

    async function cargarOrdenes() {
      try {
        const inputBuscar = document.getElementById('input-buscar');
        const textoBusquedaActual = inputBuscar ? inputBuscar.value : '';

        const res = await fetch(`/api/ordenes/${seccionActual}`);
        todasLasOrdenesActuales = await res.json();

        // Si hay texto en el buscador, filtramos de inmediato sin perder el foco ni limpiar la vista
        if (textoBusquedaActual.trim() !== '') {
          const texto = textoBusquedaActual.toLowerCase().trim();
          const filtradas = todasLasOrdenesActuales.filter(ot => {
            const cliente = (ot.client_name || '').toLowerCase();
            const otNum = String(ot.ot_numero || '');
            return cliente.includes(texto) || otNum.includes(texto);
          });
          renderizarOrdenes(filtradas);
        } else {
          renderizarOrdenes(todasLasOrdenesActuales);
        }
      } catch (err) {
        console.error(err);
        document.getElementById('orders-container').innerHTML = '<p style="color: red; font-weight: bold;">Error al cargar las órdenes desde el servidor.</p>';
      }
    }

    function filtrarOrdenes() {
      const inputEl = document.getElementById('input-buscar');
      if (!inputEl) return;
      const texto = inputEl.value.toLowerCase().trim();
      
      const filtradas = todasLasOrdenesActuales.filter(ot => {
        const cliente = (ot.client_name || '').toLowerCase();
        const otNum = String(ot.ot_numero || '');
        return cliente.includes(texto) || otNum.includes(texto);
      });

      renderizarOrdenes(filtradas);
    }

    function renderizarOrdenes(ordenes) {
      const container = document.getElementById('orders-container');
      container.innerHTML = '';

      if (!Array.isArray(ordenes) || ordenes.length === 0) {
        container.innerHTML = '<p style="color: #64748b; font-weight: bold;">No se encontraron pedidos con ese criterio de búsqueda.</p>';
        return;
      }

      ordenes.forEach(ot => {
        let tieneMedidaFaltante = false;
        let todosImpresos = true;
        let todosEntregados = true;
        let listadoItemsHTML = '';
        let resumenMateriales = [];
        let totalM2 = 0;

        if (ot.items && ot.items.length > 0) {
          listadoItemsHTML = ot.items.map((item) => {
            const ancho = parseFloat(item.width_cm || 0);
            const alto = parseFloat(item.height_cm || 0);
            const nombreMaterial = (item.material || '').toLowerCase();
            const esUnitario = nombreMaterial.includes('fly banner') || 
                               nombreMaterial.includes('roll up') || 
                               nombreMaterial.includes('portabanner') || 
                               nombreMaterial.includes('sublimado') ||
                               nombreMaterial.includes('base cruz') ||
                               nombreMaterial.includes('contrapeso');

            if (!esUnitario && (ancho === 0 || alto === 0)) tieneMedidaFaltante = true;
            if (seccionActual === 'impresion' && !item.is_printed) todosImpresos = false;
            if (seccionActual === 'entrega' && !item.is_delivered_item) todosEntregados = false;

            totalM2 += esUnitario ? (item.copies || 1) : ((ancho / 100) * (alto / 100) * (item.copies || 1));
            if (item.material) resumenMateriales.push(`${item.material} (${item.impresion || 'Std'})`);
            
            const urlFile = item.file_url || '#';
            const esWarning = !esUnitario && (ancho === 0 || alto === 0);

            if (seccionActual === 'diseno') {
              return `
                <div class="item-row ${esWarning ? 'warning-item' : ''}">
                  <a href="${item.file_url && item.file_url !== '#' ? item.file_url : '#'}" target="_blank" class="btn-download" title="${item.file_name}">
                    📥 ${item.file_name} <strong>(${esUnitario ? item.copies + ' un.' : ancho + 'x' + alto + ' cm'})</strong>
                  </a>
                  <button onclick="editarLinkArchivo(${item.id}, '${item.file_url || ''}')" class="btn-edit" title="Editar Link (Drive, WeTransfer, etc.)">🔗</button>
                  <button onclick="editarNombreArchivo(${item.id}, '${item.file_name}')" class="btn-edit" title="Editar nombre">✏️</button>
                  <button onclick="editarMedidasItem(${item.id}, '${item.file_name}', ${ancho}, ${alto}, ${item.copies || 1})" class="btn-edit-size" title="Editar medida">
                    📏 ${esWarning ? 'Cargar Medida' : 'Editar'}
                  </button>
                  <button onclick="eliminarItem(${item.id})" class="btn-delete-item" title="Eliminar ítem">❌</button>
                </div>`;
            
            } else if (seccionActual === 'impresion') {
              return `
                <div class="item-row">
                  <a href="${urlFile}" target="_blank" class="btn-download" style="font-weight: bold; color: #5b3693;">
                    📥 ${item.file_name} <strong>(${esUnitario ? item.copies + ' un.' : ancho + 'x' + alto + ' cm'})</strong>
                  </a>
                  <label style="display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 0.85rem; font-weight: bold; color: ${item.is_printed ? '#10b981' : '#64748b'};">
                    <input type="checkbox" ${item.is_printed ? 'checked' : ''} onchange="toggleItemStatus(${item.id}, 'printed', this.checked)" style="width: 18px; height: 18px; accent-color: #10b981; cursor: pointer;">
                    ${item.is_printed ? 'IMPRESO ✔️' : 'Pendiente'}
                  </label>
                </div>`;
            } else if (seccionActual === 'entrega') {
              return `
                <div class="item-row">
                  <a href="${urlFile}" target="_blank" class="btn-download" style="font-weight: bold; color: #5b3693;">
                    📥 ${item.file_name} <strong>(${esUnitario ? item.copies + ' un.' : ancho + 'x' + alto + ' cm'})</strong>
                  </a>
                  <label style="display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 0.85rem; font-weight: bold; color: ${item.is_delivered_item ? '#10b981' : '#64748b'};">
                    <input type="checkbox" ${item.is_delivered_item ? 'checked' : ''} onchange="toggleItemStatus(${item.id}, 'delivered', this.checked)" style="width: 18px; height: 18px; accent-color: #10b981; cursor: pointer;">
                    ${item.is_delivered_item ? 'LISTO ✔️' : 'Pendiente'}
                  </label>
                </div>`;
            } else {
              return `
                <div class="item-row">
                  <a href="${urlFile}" target="_blank" class="btn-download" style="font-weight: bold; color: #5b3693;">
                    📥 ${item.file_name} <strong>(${esUnitario ? item.copies + ' un.' : ancho + 'x' + alto + ' cm'})</strong>
                  </a>
                </div>`;
            }
          }).join('');
        }

        const materialesUnicos = [...new Set(resumenMateriales)].join(', ');

        let botonSiguiente = '';
        let seccionBotonesExtras = '';
        let seccionEntregaExtra = '';

        if (seccionActual === 'diseno') {
          const disabledAttr = tieneMedidaFaltante ? 'disabled title="Debe cargar las medidas antes de avanzar"' : '';
          botonSiguiente = `<button onclick="cambiarEstado(${ot.ot_numero}, 'READY_TO_PRINT')" class="btn btn-status" ${disabledAttr}>Pasar a Impresión ➔</button>`;
          seccionBotonesExtras = `
            <button onclick="generarComprobanteOT(${ot.ot_numero})" class="btn btn-ot">📄 Ver / Descargar Orden de Trabajo</button>
            <a href="${ot.client_email ? `https://mail.google.com/mail/u/0/#search/from%3A${encodeURIComponent(ot.client_email)}` : 'https://mail.google.com'}" target="_blank" class="btn btn-gmail">✉️ Responder Gmail Cliente</a>
          `;
        } else if (seccionActual === 'impresion') {
          const disabledEntrega = !todosImpresos ? 'disabled title="Debe tildar/verificar todos los archivos antes de pasar a entrega"' : '';
          const bgEntrega = todosImpresos ? '#0ada56' : '#cbd5e1';
          
          botonSiguiente = `<button onclick="cambiarEstado(${ot.ot_numero}, 'READY_TO_DELIVER')" class="btn btn-status" style="background-color: ${bgEntrega};" ${disabledEntrega}>Pasar a Entrega ➔</button>`;
          seccionBotonesExtras = `<button onclick="generarComprobanteOT(${ot.ot_numero})" class="btn btn-ot">📄 Ver / Descargar Orden de Trabajo</button>`;
        } else if (seccionActual === 'entrega') {
          seccionEntregaExtra += `
            <div class="input-group">
              <label>Entrega (Fecha Prometida):</label>
              <input type="text" class="input-custom" value="${ot.fecha_prometida || ''}" onchange="guardarInfoEntrega(${ot.ot_numero}, 'fecha_prometida', this.value)" placeholder="Ej. Viernes 15hs">
            </div>`;

          const disabledHistorial = !todosEntregados ? 'disabled title="Debe tildar todos los ítems para entregar"' : '';
          const bgHistorial = todosEntregados ? '#0ada56' : '#cbd5e1';

          botonSiguiente = `<button onclick="cambiarEstado(${ot.ot_numero}, 'DELIVERED')" class="btn btn-status" style="background-color: ${bgHistorial};" ${disabledHistorial}>Finalizar Entrega (Enviar a Historial) ✔️</button>`;
          seccionBotonesExtras = `<button onclick="generarComprobanteOT(${ot.ot_numero})" class="btn btn-ot">📄 Ver / Descargar Orden de Trabajo</button>`;

          seccionEntregaExtra += `
            <div class="input-group" style="margin-top: 10px;">
              <label>Entregado por:</label>
              <input type="text" class="input-custom" value="${ot.entregado_por || ''}" onchange="guardarInfoEntrega(${ot.ot_numero}, 'entregado_por', this.value)" placeholder="Nombre del empleado">
            </div>
            <div class="input-group" style="margin-top: 8px; margin-bottom: 12px;">
              <label>Fecha de Entrega:</label>
              <input type="text" class="input-custom" value="${ot.fecha_entrega || ''}" onchange="guardarInfoEntrega(${ot.ot_numero}, 'fecha_entrega', this.value)" placeholder="Ej. 26/09/2026">
            </div>`;
        } else if (seccionActual === 'historial') {
          seccionBotonesExtras = `<button onclick="generarComprobanteOT(${ot.ot_numero})" class="btn btn-ot">📄 Ver / Descargar Orden de Trabajo</button>`;
        }

        const badgeHTML = seccionActual === 'historial'
          ? `<span class="badge badge-success">ENTREGADO ✔️</span>`
          : (tieneMedidaFaltante ? `<span class="badge badge-warning">⚠️ FALTA MEDIDA</span>` : `<span class="badge">${ot.status}</span>`);

        const botonAgregarItemHTML = seccionActual === 'diseno' 
          ? `<button onclick="agregarItemManual(${ot.ot_numero})" class="btn-add-item">➕ Agregar Ítem</button>` : '';

        const botonEliminarOrden = `<button onclick="eliminarOrden(${ot.ot_numero})" class="btn btn-delete-order">🗑️ Eliminar Orden Completa</button>`;

        container.innerHTML += `
          <div class="card ${tieneMedidaFaltante && seccionActual !== 'historial' ? 'warning' : ''} ${seccionActual === 'historial' ? 'delivered' : ''}">
            <div class="card-header">
              <h3 class="card-title">
                OT #${ot.ot_numero}
                <button onclick="editarNumeroOT(${ot.ot_numero})" class="btn-edit" title="Editar número de orden">✏️</button>
              </h3>
              ${badgeHTML}
            </div>
            
            <div class="data-group">
              <span>Cliente:</span> <strong>${ot.client_name || 'Sin Especificar'}</strong>
              ${seccionActual === 'diseno' ? `<button onclick="editarCliente(${ot.ot_numero}, '${ot.client_name || ''}')" class="btn-edit" title="Editar cliente">✏️</button>` : ''}
              <br><span class="email-tag">(${ot.client_email})</span>
            </div>

            ${ot.notes ? `<div class="data-group" style="background: #fef3c7; padding: 6px; border-radius: 6px; margin-top: 4px; font-size: 0.85rem;"><span>📝 Notas:</span> ${ot.notes}</div>` : ''}

            <div class="data-group"><span>Materiales:</span> ${materialesUnicos || 'Varios / Por definir'}</div>
            <div class="data-group"><span>Resumen:</span> ${ot.items ? ot.items.length : 0} diseño(s) / ${totalM2.toFixed(2)} m² total</div>
            <div class="data-group"><span>Total:</span> $${Number(ot.total_price || 0).toLocaleString('es-AR')} ARS</div>

            ${seccionEntregaExtra}

            <div class="file-actions">
              <span style="font-size: 0.85rem; font-weight: bold;">Adjuntos / Ítems (${ot.items ? ot.items.length : 0}):</span>
              <div class="attachments-container">${listadoItemsHTML}</div>
              ${botonAgregarItemHTML}
            </div>

            ${seccionBotonesExtras}
            ${botonSiguiente}
            ${botonEliminarOrden}
          </div>`;
      });
    }

    async function toggleItemStatus(itemId, tipo, isChecked) {
      const endpoint = tipo === 'printed' ? `/api/ordenes/item/printed/${itemId}` : `/api/ordenes/item/delivered/${itemId}`;
      const payload = tipo === 'printed' ? { is_printed: isChecked } : { is_delivered_item: isChecked };
      
      await fetch(endpoint, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
      cargarOrdenes();
    }

    async function guardarInfoEntrega(otId, campo, valor) {
      const body = {};
      body[campo] = valor;
      await fetch(`/api/ordenes/entrega-info/${otId}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    }

    async function editarNumeroOT(idActual) {
      const nuevoNum = prompt("Ingresa el nuevo número de orden deseado:", idActual);
      if (!nuevoNum || isNaN(nuevoNum)) return;
      const res = await fetch(`/api/ordenes/numero/${idActual}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nuevo_numero: parseInt(nuevoNum) })
      });
      if (res.ok) cargarOrdenes();
      else alert("Error al actualizar el número.");
    }

    async function eliminarOrden(otId) {
      if (!confirm(`⚠️ ¿Seguro de eliminar la OT #${otId}?`)) return;
      const res = await fetch(`/api/ordenes/${otId}`, { method: 'DELETE' });
      if (res.ok) cargarOrdenes();
    }

    async function editarNombreArchivo(itemId, nombreActual) {
      const nuevoNombre = prompt("Nuevo nombre para el archivo:", nombreActual);
      if (!nuevoNombre || nuevoNombre.trim() === "") return;
      await fetch(`/api/ordenes/item-nombre/${itemId}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ file_name: nuevoNombre.trim() })
      });
      cargarOrdenes();
    }

    async function editarMedidasItem(itemId, nombreArchivo, anchoActual, altoActual, cantActual) {
      const nuevoAncho = prompt(`Ancho en cm para "${nombreArchivo}":`, anchoActual || 100);
      if (nuevoAncho === null) return;
      const nuevoAlto = prompt(`Alto en cm para "${nombreArchivo}":`, altoActual || 100);
      if (nuevoAlto === null) return;
      const nuevasCopias = prompt(`Copias para "${nombreArchivo}":`, cantActual || 1);
      if (nuevasCopias === null) return;

      await fetch(`/api/ordenes/item/${itemId}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ width_cm: parseFloat(nuevoAncho), height_cm: parseFloat(nuevoAlto), copies: parseInt(nuevasCopias) })
      });
      cargarOrdenes();
    }

    async function editarLinkArchivo(itemId, urlActual) {
      const nuevoLink = prompt("Pega aquí cualquier link (Google Drive, WeTransfer, Imagen JPG/PNG, etc.):", urlActual === '#' ? '' : urlActual);
      if (nuevoLink === null) return;

      await fetch(`/api/ordenes/item-url/${itemId}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ file_url: nuevoLink.trim() || '#' })
      });
      cargarOrdenes();
    }

    async function eliminarItem(itemId) {
      if (!confirm("¿Eliminar este ítem?")) return;
      await fetch(`/api/ordenes/item/${itemId}`, { method: 'DELETE' });
      cargarOrdenes();
    }

    async function agregarItemManual(otId) {
      currentOtIdParaAgregar = otId;
      const resCat = await fetch('/api/catalogos');
      const catalogos = await resCat.json();
      
      const selectMat = document.getElementById('modal-material');
      const selectPrint = document.getElementById('modal-print-type');
      selectMat.innerHTML = '';
      selectPrint.innerHTML = '';

      catalogos.materials.forEach(m => selectMat.innerHTML += `<option value="${m.id}">${m.name}</option>`);
      catalogos.printTypes.forEach(pt => selectPrint.innerHTML += `<option value="${pt.id}">${pt.name}</option>`);

      document.getElementById('modal-agregar-item').style.display = 'flex';
    }

    function cerrarModalItem() {
      document.getElementById('modal-agregar-item').style.display = 'none';
      currentOtIdParaAgregar = null;
    }

    async function guardarItemManual() {
      if (!currentOtIdParaAgregar) return;
      const material_id = document.getElementById('modal-material').value;
      const print_type_id = document.getElementById('modal-print-type').value;
      const file_name = document.getElementById('modal-filename').value.trim();
      const width_cm = document.getElementById('modal-width').value;
      const height_cm = document.getElementById('modal-height').value;
      const copies = document.getElementById('modal-copies').value;

      await fetch(`/api/ordenes/${currentOtIdParaAgregar}/item`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ file_name, material_id: parseInt(material_id), print_type_id: parseInt(print_type_id), width_cm: parseFloat(width_cm), height_cm: parseFloat(height_cm), copies: parseInt(copies), file_url: '#' })
      });
      cerrarModalItem();
      cargarOrdenes();
    }

    function abrirModalOrdenManual() {
      document.getElementById('manual-client-name').value = '';
      document.getElementById('manual-client-email').value = '';
      document.getElementById('manual-notes').value = '';
      document.getElementById('modal-orden-manual').style.display = 'flex';
    }

    function cerrarModalOrdenManual() {
      document.getElementById('modal-orden-manual').style.display = 'none';
    }

    async function guardarOrdenManual(event) {
      event.preventDefault();
      const clientName = document.getElementById('manual-client-name').value.trim();
      const clientEmail = document.getElementById('manual-client-email').value.trim();
      const notes = document.getElementById('manual-notes').value.trim();

      await fetch('/api/orders/manual', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ clientName, clientEmail, notes })
      });
      cerrarModalOrdenManual();
      cargarOrdenes();
    }

    async function editarCliente(id, nombreActual) {
      const nuevoNombre = prompt("Nombre correcto del cliente:", nombreActual);
      if (!nuevoNombre || nuevoNombre.trim() === "") return;
      await fetch(`/api/ordenes/cliente/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ client_name: nuevoNombre.trim() })
      });
      cargarOrdenes();
    }

    function generarComprobanteOT(id) {
      window.open(`/ot/${id}`, '_blank');
    }

    async function cambiarEstado(id, nuevoEstado) {
      if(!confirm(`¿Deseas avanzar el estado de la OT #${id}?`)) return;
      await fetch(`/api/ordenes/estado/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status: nuevoEstado })
      });
      cargarOrdenes();
    }
  </script>
</body>
</html>
